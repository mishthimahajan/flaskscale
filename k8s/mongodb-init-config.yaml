
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: flaskscale
data:
  create-app-user.sh: |
    #!/bin/bash
    set -eu

    mongosh "$MONGO_INITDB_DATABASE" --quiet --eval "
      db.createUser({
        user: '$MONGO_APP_USERNAME',
        pwd: '$MONGO_APP_PASSWORD',
        roles: [
          { role: 'readWrite', db: '$MONGO_INITDB_DATABASE' }
        ]
      });
    "
